<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: monospace, sans-serif;
            background-color: #0d1117;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
            display: none;
        }
        #fps-counter {
            position: absolute; top: 12px; left: 12px;
            color: #ffffff; font-size: 14px; font-weight: bold;
            pointer-events: none; z-index: 10;
            display: none;
        }
        body.playing #crosshair { display: block; }
        body.playing #fps-counter { display: block; }

        /* ============================================================
           MAIN MENU
           ============================================================ */
        #menu {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            color: #e8eef6;
            background: radial-gradient(circle at 50% 45%,
                        rgba(6, 10, 18, 0.10) 0%,
                        rgba(6, 10, 18, 0.62) 100%);
            padding: 16px;
        }
        #menu.hidden { display: none; }

        .menu-panel {
            width: min(94vw, 540px);
            max-height: 88vh;
            overflow-y: auto;
            padding: 26px 26px 22px;
            background: rgba(13, 17, 23, 0.84);
            border: 1px solid rgba(120, 160, 210, 0.28);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 10px;
            animation: menuIn 0.22s ease;
        }
        @keyframes menuIn {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to   { opacity: 1; transform: none; }
        }
        .menu-panel.hidden { display: none; }

        .menu-panel h1 {
            font-size: 26px; letter-spacing: 6px; text-align: center;
            color: #cfe3ff;
            text-shadow: 0 0 22px rgba(90, 160, 255, 0.55);
        }
        .menu-panel h2 {
            font-size: 15px; letter-spacing: 4px; text-transform: uppercase;
            color: #9fb6d4; margin-bottom: 4px;
        }
        .menu-panel .sub {
            text-align: center; font-size: 11px; color: #7d8ea6;
            letter-spacing: 1px; margin-bottom: 14px;
        }
        .lbl {
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            color: #8ba0bb; margin-top: 4px;
        }
        .hint { font-size: 11px; color: #71849c; line-height: 1.5; }

        .mbtn {
            appearance: none; -webkit-appearance: none;
            border: 1px solid rgba(120, 160, 210, 0.35);
            background: rgba(30, 42, 60, 0.78);
            color: #dbe7f7; font: inherit; font-size: 13px;
            letter-spacing: 2px; text-transform: uppercase;
            padding: 13px 16px; border-radius: 9px; cursor: pointer;
            transition: background .15s, border-color .15s, transform .08s, box-shadow .15s;
        }
        .mbtn:hover {
            background: rgba(48, 72, 104, 0.92);
            border-color: rgba(140, 190, 255, 0.7);
            box-shadow: 0 0 18px rgba(90, 166, 255, 0.18);
        }
        .mbtn:active { transform: translateY(1px); }
        .mbtn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
        .mbtn.primary {
            background: linear-gradient(180deg, #2f7a4a, #215a36);
            border-color: #3f9a5f; color: #eafff1;
        }
        .mbtn.primary:hover {
            background: linear-gradient(180deg, #3a9159, #27693f);
            border-color: #56c47c;
        }
        .mbtn.ghost { background: transparent; }

        .txt {
            width: 100%; padding: 12px 13px; border-radius: 9px;
            background: rgba(8, 12, 18, 0.9);
            border: 1px solid rgba(120, 160, 210, 0.3);
            color: #e6f0ff; font: inherit; font-size: 14px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .txt:focus {
            border-color: #5aa6ff;
            box-shadow: 0 0 0 3px rgba(90, 166, 255, 0.16);
        }
        select.txt { cursor: pointer; }

        .row { display: flex; gap: 8px; }
        .row .mbtn { flex: 1; }

        .world-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 46vh; overflow-y: auto; padding-right: 4px;
            margin: 4px 0 6px;
        }
        .world-list::-webkit-scrollbar { width: 8px; }
        .world-list::-webkit-scrollbar-thumb {
            background: rgba(90, 130, 180, 0.4); border-radius: 4px;
        }
        .empty { color: #6f8199; font-size: 12px; text-align: center; padding: 22px 0; }

        .world-card {
            display: flex; align-items: center; gap: 10px;
            padding: 8px; border-radius: 10px; cursor: pointer;
            background: rgba(28, 38, 52, 0.72);
            border: 1px solid rgba(120, 160, 210, 0.2);
            transition: background .15s, border-color .15s, box-shadow .15s;
        }
        .world-card:hover { background: rgba(44, 62, 86, 0.92); }
        .world-card.selected {
            border-color: #5aa6ff;
            box-shadow: 0 0 0 1px #5aa6ff inset, 0 0 20px rgba(90, 166, 255, 0.25);
        }
        .world-card img {
            width: 88px; height: 55px; object-fit: cover;
            border-radius: 6px; background: #0b1017; flex: none;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .world-info { flex: 1; min-width: 0; }
        .world-name {
            font-size: 13px; color: #e2ecfa;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .world-date { font-size: 10px; color: #7f92ab; margin-top: 4px; }
        .world-actions { display: flex; flex-direction: column; gap: 4px; }
        .mini {
            appearance: none; border: 1px solid rgba(120, 160, 210, 0.3);
            background: rgba(20, 28, 40, 0.9); color: #a9bdd6;
            font: inherit; font-size: 9px; letter-spacing: 1px;
            padding: 5px 7px; border-radius: 6px; cursor: pointer;
            transition: .15s;
        }
        .mini:hover { background: rgba(56, 82, 116, 0.95); color: #e2ecfa; }
        .mini.danger:hover {
            background: rgba(120, 40, 46, 0.95);
            border-color: #a04a52; color: #ffd9dc;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="fps-counter">0 FPS</div>

    <!-- ============================================================
         MAIN MENU OVERLAY
         ============================================================ -->
    <div id="menu">
        <div class="menu-panel" id="menu-main">
            <h1>VOXEL WORLD</h1>
            <p class="sub">A tiny 3D voxel engine</p>
            <button class="mbtn" id="btn-new">New World</button>
            <button class="mbtn" id="btn-play">Play World</button>
            <button class="mbtn" id="btn-settings">Settings</button>
        </div>

        <div class="menu-panel hidden" id="panel-new">
            <h2>New World</h2>
            <label class="lbl" for="world-name">World name</label>
            <input id="world-name" class="txt" type="text" maxlength="24" placeholder="My World" autocomplete="off" />
            <button class="mbtn primary" id="btn-create">Join</button>
            <button class="mbtn" id="btn-import">Import .vwf</button>
            <input type="file" id="file-import" accept=".vwf,application/json" hidden />
            <button class="mbtn ghost" data-back>Back</button>
        </div>

        <div class="menu-panel hidden" id="panel-play">
            <h2>Play World</h2>
            <div id="world-list" class="world-list"></div>
            <div class="row">
                <button class="mbtn primary" id="btn-play-selected" disabled>Play</button>
                <button class="mbtn" id="btn-export" disabled>Export .vwf</button>
            </div>
            <button class="mbtn ghost" data-back>Back</button>
        </div>

        <div class="menu-panel hidden" id="panel-settings">
            <h2>Settings</h2>
            <label class="lbl" for="quality">Quality</label>
            <select id="quality" class="txt">
                <option value="min">Min</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="max">Max</option>
            </select>
            <p class="hint" id="quality-hint"></p>
            <button class="mbtn ghost" data-back>Back</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ============================================================
        // 1. RENDERER, SCENE, CAMERA
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8fc4f0);
        scene.fog = new THREE.FogExp2(0x8fc4f0, 0.024);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });

        renderer.setSize(window.innerWidth, window.innerHeight);
        // Lower pixel-ratio cap = big perf win on high-DPI displays
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.physicallyCorrectLights = true;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // 2. POST-PROCESSING (bloom + god rays + halation)
        // ============================================================
        const composer = new THREE.EffectComposer(renderer);
        composer.setSize(window.innerWidth, window.innerHeight);
        composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

        composer.addPass(new THREE.RenderPass(scene, camera));

        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.28, 0.5, 0.88
        );
        composer.addPass(bloomPass);

        const godRaysUniforms = {
            tDiffuse:    { value: null },
            sunPosition: { value: new THREE.Vector2(0.5, 0.5) },
            density:     { value: 0.9 },
            decay:       { value: 0.965 },
            weight:      { value: 4.5 },
            exposure:    { value: 0.35 },
            threshold:   { value: 0.78 },
            visibility:  { value: 0.0 },
            rayTint:     { value: new THREE.Color(1.0, 0.85, 0.6) }
        };

        const godRaysPass = new THREE.ShaderPass({
            uniforms: godRaysUniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
            `,
            fragmentShader: `
                #define NUM_SAMPLES 24
                uniform sampler2D tDiffuse;
                uniform vec2 sunPosition;
                uniform float density, decay, weight, exposure, threshold, visibility;
                uniform vec3 rayTint;
                varying vec2 vUv;
                void main() {
                    vec4 base = texture2D(tDiffuse, vUv);
                    vec3 rays = vec3(0.0);
                    if (visibility > 0.001) {
                        vec2 delta = (vUv - sunPosition) * (1.0 / float(NUM_SAMPLES)) * density;
                        vec2 coord = vUv;
                        float illum = 1.0;
                        for (int i = 0; i < NUM_SAMPLES; i++) {
                            coord -= delta;
                            vec3 s = texture2D(tDiffuse, coord).rgb;
                            float lum = dot(s, vec3(0.2126, 0.7152, 0.0722));
                            rays += s * max(lum - threshold, 0.0) * illum * weight;
                            illum *= decay;
                        }
                        rays *= exposure * visibility;
                    }
                    gl_FragColor = vec4(base.rgb + rays * rayTint, base.a);
                }
            `
        });
        composer.addPass(godRaysPass);

        const halationUniforms = {
            tDiffuse:   { value: null },
            strength:   { value: 0.55 },
            threshold:  { value: 0.82 },
            radius1:    { value: 11.0 },
            radius2:    { value: 30.0 },
            resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            tint:       { value: new THREE.Color(1.0, 0.32, 0.15) }
        };

        const halationPass = new THREE.ShaderPass({
            uniforms: halationUniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float strength, threshold, radius1, radius2;
                uniform vec2 resolution;
                uniform vec3 tint;
                varying vec2 vUv;
                float lum(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
                void main() {
                    vec4 base = texture2D(tDiffuse, vUv);
                    vec3 glow = vec3(0.0);
                    for (int i = 0; i < 6; i++) {
                        float a = float(i) * 1.0471975512;
                        vec2 o1 = vec2(cos(a), sin(a)) * radius1 / resolution;
                        vec3 s1 = texture2D(tDiffuse, vUv + o1).rgb;
                        glow += s1 * max(lum(s1) - threshold, 0.0);
                        float a2 = a + 0.5235987756;
                        vec2 o2 = vec2(cos(a2), sin(a2)) * radius2 / resolution;
                        vec3 s2 = texture2D(tDiffuse, vUv + o2).rgb;
                        glow += s2 * max(lum(s2) - threshold, 0.0) * 0.5;
                    }
                    glow /= 9.0;
                    gl_FragColor = vec4(base.rgb + glow * tint * strength, base.a);
                }
            `
        });
        composer.addPass(halationPass);

        // ============================================================
        // 3. LIGHTING — balanced for readable pixel textures + realistic sky
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.50);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xcce0ff, 0x3d352e, 0.45);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff8eb, 1.65);
        sunLight.position.set(16, 28, 14);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 90;
        const shadowExtent = 18;
        sunLight.shadow.camera.left = -shadowExtent;
        sunLight.shadow.camera.right = shadowExtent;
        sunLight.shadow.camera.top = shadowExtent;
        sunLight.shadow.camera.bottom = -shadowExtent;
        sunLight.shadow.bias = -0.00025;
        sunLight.shadow.normalBias = 0.035;
        sunLight.shadow.radius = 2.5;
        scene.add(sunLight);

        const moonLight = new THREE.DirectionalLight(0x9fb6ff, 0.0);
        moonLight.castShadow = false;
        scene.add(moonLight);
        scene.add(moonLight.target);
        scene.add(sunLight.target);

        // ============================================================
        // 4. DAY / NIGHT CYCLE STATE
        // ============================================================
        const dayCycleDuration = 120;
        let timeOfDay = 0.25;
        const sunOrbitTilt = 0.35;

        const skyDayColor   = new THREE.Color(0x8fc4f0);
        const skyDuskColor  = new THREE.Color(0xd9763c);
        const skyNightColor = new THREE.Color(0x05070f);
        const sunDayColor   = new THREE.Color(0xfff8eb);
        const sunDuskColor  = new THREE.Color(0xff8a3d);
        const moonColor     = new THREE.Color(0x9fb6ff);

        const skyColor = new THREE.Color();
        const sunDir = new THREE.Vector3();
        const moonDir = new THREE.Vector3();
        const tmpColor = new THREE.Color();

        let godRayDaylight = 0;
        let godRayHorizonH = 0;
        let elapsedTime = 0;

        // ============================================================
        // 5. SKY DOME + SUN/MOON + STARS
        // ============================================================
        function createGlowTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0.00, 'rgba(255,255,255,1)');
            g.addColorStop(0.10, 'rgba(255,255,255,0.9)');
            g.addColorStop(0.22, 'rgba(255,255,255,0.42)');
            g.addColorStop(0.50, 'rgba(255,255,255,0.08)');
            g.addColorStop(1.00, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }
        const glowTexture = createGlowTexture();

        const sunSpriteMat = new THREE.SpriteMaterial({
            map: glowTexture,
            color: new THREE.Color(1.0, 0.9, 0.72),
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        });
        const sunBody = new THREE.Sprite(sunSpriteMat);
        sunBody.scale.set(36, 36, 1);
        scene.add(sunBody);

        const moonSpriteMat = new THREE.SpriteMaterial({
            map: glowTexture, color: 0xdfe8ff,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false
        });
        const moonBody = new THREE.Sprite(moonSpriteMat);
        moonBody.scale.set(22, 22, 1);
        scene.add(moonBody);

        function createStarTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 32;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0.0, 'rgba(255,255,255,1)');
            g.addColorStop(0.35, 'rgba(255,255,255,0.6)');
            g.addColorStop(1.0, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(c);
        }

        const STAR_COUNT = 700;
        const starPositions = new Float32Array(STAR_COUNT * 3);
        for (let i = 0; i < STAR_COUNT; i++) {
            const u = Math.random() * 2 - 1;
            const theta = Math.random() * Math.PI * 2;
            const r = Math.sqrt(1 - u * u);
            const radius = 355 + Math.random() * 25;
            starPositions[i*3]   = Math.cos(theta) * r * radius;
            starPositions[i*3+1] = u * radius;
            starPositions[i*3+2] = Math.sin(theta) * r * radius;
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
            map: createStarTexture(), size: 3.0, sizeAttenuation: false,
            transparent: true, opacity: 0, depthWrite: false,
            blending: THREE.AdditiveBlending, color: 0xffffff, fog: false
        });
        const starGroup = new THREE.Points(starGeo, starMat);
        starGroup.frustumCulled = false;
        scene.add(starGroup);

        const celestialAxis = new THREE.Vector3(0, -Math.sin(sunOrbitTilt), Math.cos(sunOrbitTilt)).normalize();

        const skyUniforms = {
            topColor:    { value: new THREE.Color(0x2a6fd0) },
            bottomColor: { value: new THREE.Color(0x8fc4f0) },
            sunDir:      { value: new THREE.Vector3(0, 1, 0) },
            sunColor:    { value: new THREE.Color(0xfff8eb) },
            sunGlow:     { value: 0.55 }
        };

        const skyDome = new THREE.Mesh(
            new THREE.SphereGeometry(400, 32, 24),
            new THREE.ShaderMaterial({
                uniforms: skyUniforms,
                vertexShader: `
                    varying vec3 vDir;
                    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
                `,
                fragmentShader: `
                    uniform vec3 topColor, bottomColor, sunDir, sunColor;
                    uniform float sunGlow;
                    varying vec3 vDir;
                    void main() {
                        vec3 dir = normalize(vDir);
                        float h = dir.y;
                        vec3 col = mix(bottomColor, topColor, pow(clamp(h, 0.0, 1.0), 0.62));
                        col = mix(col, bottomColor * 0.45, clamp(-h * 2.0, 0.0, 1.0));
                        float d = max(dot(dir, sunDir), 0.0);
                        col += sunColor * (pow(d, 4.0) * 0.14 + pow(d, 24.0) * 0.48) * sunGlow;
                        float haze = pow(1.0 - clamp(abs(h), 0.0, 1.0), 8.0);
                        col = mix(col, bottomColor, haze * 0.45);
                        gl_FragColor = vec4(col, 1.0);
                    }
                `,
                side: THREE.BackSide, depthWrite: false, fog: false
            })
        );
        skyDome.renderOrder = -1000;
        skyDome.frustumCulled = false;
        scene.add(skyDome);

        // ============================================================
        // 6. CLOUDS — multi-layered planes with baked puffy shading
        // ============================================================
        const CLOUD_TEX_SIZE = 256;

        function hash2(x, y, s) {
            const v = Math.sin(x * 12.9898 + y * 78.233 + s * 37.719) * 43758.5453;
            return v - Math.floor(v);
        }

        function tileNoise(x, y, period, seed) {
            const x0 = Math.floor(x), y0 = Math.floor(y);
            const x1 = x0 + 1, y1 = y0 + 1;
            const fx = x - x0, fy = y - y0;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);
            const xi0 = ((x0 % period) + period) % period;
            const yi0 = ((y0 % period) + period) % period;
            const xi1 = ((x1 % period) + period) % period;
            const yi1 = ((y1 % period) + period) % period;
            const a = hash2(xi0, yi0, seed);
            const b = hash2(xi1, yi0, seed);
            const c = hash2(xi0, yi1, seed);
            const d = hash2(xi1, yi1, seed);
            return a * (1-sx)*(1-sy) + b * sx*(1-sy) + c * (1-sx)*sy + d * sx*sy;
        }

        // Cloud texture with baked-in puffiness so the alpha alone reads as 3D
        function createCloudTexture(size, coverage, softness, seed) {
            const height = new Float32Array(size * size);
            const octaves = [
                { cells: 4,  amp: 0.50 },
                { cells: 8,  amp: 0.25 },
                { cells: 16, amp: 0.125 },
                { cells: 32, amp: 0.0625 },
                { cells: 64, amp: 0.03125 }
            ];

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const u = x / size, v = y / size;
                    let n = 0;
                    for (const oct of octaves) {
                        n += oct.amp * tileNoise(u * oct.cells, v * oct.cells, oct.cells, seed);
                    }
                    height[y * size + x] = n;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            const img = ctx.createImageData(size, size);
            const data = img.data;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = y * size + x;
                    const h = height[idx];

                    let a = (h - coverage) / softness;
                    a = Math.max(0, Math.min(1, a));
                    a = a * a * (3 - 2 * a);

                    if (a < 0.012) {
                        data[idx*4+3] = 0;
                        continue;
                    }

                    // Baked puffy shading from the local height gradient
                    const xn = (x + size - 1) % size;
                    const yn = (y + size - 1) % size;
                    const xp = (x + 1) % size;
                    const yp = (y + 1) % size;
                    const gx = height[y*size + xp] - height[y*size + xn];
                    const gy = height[yp*size + x] - height[yn*size + x];

                    // Fake light from upper-left of texture
                    const lit = 0.62 + (gx * 1.8 + gy * 1.8);
                    const brightness = Math.max(0.40, Math.min(1.0, lit));

                    // Backlit thin edges: brighten where alpha is thin
                    const backlit = Math.pow(1 - a, 1.6) * 0.42;
                    const finalBright = Math.min(1.0, brightness + backlit);

                    // Cloud colors: cool-white highlights, grey-blue shadows
                    const r = Math.floor(148 + 107 * finalBright);
                    const g = Math.floor(160 + 95 * finalBright);
                    const b = Math.floor(180 + 75 * finalBright);

                    data[idx*4+0] = r;
                    data[idx*4+1] = g;
                    data[idx*4+2] = b;
                    data[idx*4+3] = Math.floor(a * 255);
                }
            }

            ctx.putImageData(img, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        const cloudGroup = new THREE.Group();
        cloudGroup.frustumCulled = false;
        scene.add(cloudGroup);

        // 3 stacked layers at different altitudes → parallax reads as volume
        const cloudLayers = [];
        const cloudConfigs = [
            { y: 112, planeSize: 2000, repeat: 1.6, opacity: 0.48, coverage: 0.54, softness: 0.26, windX: 0.0035, windY: 0.0018, seed: 1.7 },
            { y:  90, planeSize: 1800, repeat: 2.6, opacity: 0.62, coverage: 0.50, softness: 0.22, windX: 0.0072, windY: 0.0036, seed: 4.3 },
            { y:  70, planeSize: 1600, repeat: 4.0, opacity: 0.55, coverage: 0.44, softness: 0.22, windX: 0.0130, windY: 0.0060, seed: 8.1 }
        ];

        for (const cfg of cloudConfigs) {
            const tex = createCloudTexture(CLOUD_TEX_SIZE, cfg.coverage, cfg.softness, cfg.seed);
            tex.repeat.set(cfg.repeat, cfg.repeat);
            const mat = new THREE.MeshBasicMaterial({
                map: tex, transparent: true, depthWrite: false,
                opacity: cfg.opacity, fog: false, color: 0xffffff, side: THREE.DoubleSide
            });
            const plane = new THREE.Mesh(new THREE.PlaneGeometry(cfg.planeSize, cfg.planeSize), mat);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = cfg.y;
            plane.renderOrder = -500 + cloudLayers.length;
            plane.frustumCulled = false;
            cloudGroup.add(plane);
            cloudLayers.push({ mesh: plane, mat, tex, cfg });
        }

        // Desaturated tint palette (no more brown clouds)
        const cloudDayTint   = new THREE.Color(0xf6f7fa);
        const cloudDuskTint  = new THREE.Color(0xe6cdb6);
        const cloudNightTint = new THREE.Color(0x35404f);
        const cloudTint = new THREE.Color();

        // ============================================================
        // 7. BLOCK TEXTURES — 16x16 pixel-art, fully randomized per block (except wood)
        // ============================================================
        const TEX_VARIANTS = 12; // distinct pixel patterns per type

        function createCanvasTexture(drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, 16);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function hashNoise(x, y, seed) {
            return Math.abs(Math.sin(x * 12.9898 + y * 78.233 + seed * 37.719) * 43758.5453) % 1;
        }

        function makeShadedTexture(shades, seed) {
            return createCanvasTexture((ctx, size) => {
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        const noise = hashNoise(x, y, seed);
                        ctx.fillStyle = shades[Math.floor(noise * shades.length)];
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            });
        }

        const grassShades    = ['#4a7c28', '#588c30', '#3b661d', '#619c36', '#437024', '#345719'];
        const stoneShades    = ['#5a5a5a', '#686868', '#4f4f4f', '#757575', '#3f3f3f', '#808080'];
        const dirtShades     = ['#6b4423', '#7a5130', '#5c3a1c', '#8b5e3c', '#4e3118', '#9a6b45'];
        const bedrockShades  = ['#1a1a1a', '#2a2a2a', '#0f0f0f', '#333333', '#222222', '#3d3d3d', '#151515', '#282828'];

        // Fully randomized pixel patterns for grass / dirt / stone / bedrock
        const grassMaterials    = [];
        const dirtMaterials     = [];
        const stoneMaterials    = [];
        const bedrockMaterials  = [];
        for (let v = 0; v < TEX_VARIANTS; v++) {
            grassMaterials.push(new THREE.MeshStandardMaterial({
                map: makeShadedTexture(grassShades, 11.7 + v * 91.3),
                roughness: 0.95, metalness: 0.0
            }));
            dirtMaterials.push(new THREE.MeshStandardMaterial({
                map: makeShadedTexture(dirtShades, 53.1 + v * 67.9),
                roughness: 1.0, metalness: 0.0
            }));
            stoneMaterials.push(new THREE.MeshStandardMaterial({
                map: makeShadedTexture(stoneShades, 31.4 + v * 44.2),
                roughness: 0.95, metalness: 0.0
            }));
            bedrockMaterials.push(new THREE.MeshStandardMaterial({
                map: makeShadedTexture(bedrockShades, 77.2 + v * 53.8),
                roughness: 0.98, metalness: 0.0
            }));
        }

        // Wood/planks — fixed pattern, never randomized
        const woodTexture = createCanvasTexture((ctx, size) => {
            const highlight  = '#c2975d';
            const baseLight  = '#b0834c';
            const base       = '#9d723f';
            const baseDark   = '#885e2f';
            const shadow     = '#6e4820';
            const darkBorder = '#4d3013';
            for (let y = 0; y < size; y++) {
                const plankIndex = Math.floor(y / 4);
                const rowInPlank = y % 4;
                for (let x = 0; x < size; x++) {
                    const isVerticalSeam = (plankIndex % 2 === 0) ? (x === 7) : (x === 15);
                    const isNearSeam     = (plankIndex % 2 === 0) ? (x === 6 || x === 8) : (x === 14 || x === 0);
                    let pixelColor;
                    if (rowInPlank === 3 || isVerticalSeam) {
                        pixelColor = darkBorder;
                    } else if (rowInPlank === 0) {
                        pixelColor = isNearSeam ? baseDark : highlight;
                    } else {
                        const noise = Math.abs(Math.sin(x * 37.1 + y * 91.7 + plankIndex * 13.3) * 43758.5453) % 1;
                        if (noise < 0.22) pixelColor = highlight;
                        else if (noise < 0.55) pixelColor = baseLight;
                        else if (noise < 0.82) pixelColor = base;
                        else if (noise < 0.94) pixelColor = baseDark;
                        else pixelColor = shadow;
                    }
                    ctx.fillStyle = pixelColor;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        });
        const woodMaterial = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.88, metalness: 0.0 });

        function variantIndex(x, y, z) {
            const h = (Math.round(x) * 73856093) ^ (Math.round(y) * 19349663) ^ (Math.round(z) * 83492791);
            return ((h >>> 0) % TEX_VARIANTS);
        }

        // ============================================================
        // 8. VOXEL WORLD — face culling + merged geometry (optimized)
        // ============================================================
        // Packed integer keys: (x+512)<<20 | (y+512)<<10 | (z+512)  — avoids string alloc
        const solidVoxels = new Set();
        let worldMeshes = [];
        let meshDirty = false;

        function packKey(x, y, z) {
            return ((x + 512) << 20) | ((y + 512) << 10) | (z + 512);
        }
        function unpackX(k) { return (k >>> 20) - 512; }
        function unpackY(k) { return ((k >>> 10) & 1023) - 512; }
        function unpackZ(k) { return (k & 1023) - 512; }

        function addVoxel(x, y, z) {
            const rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
            const key = packKey(rx, ry, rz);
            if (solidVoxels.has(key)) return;
            solidVoxels.add(key);
            meshDirty = true;
        }
        function removeVoxel(x, y, z) {
            const key = packKey(Math.round(x), Math.round(y), Math.round(z));
            if (solidVoxels.has(key)) {
                solidVoxels.delete(key);
                meshDirty = true;
            }
        }

        // Flat face data for fast access (no nested array lookups)
        const faceVertData = new Float32Array([
            // +Z
            -0.5,-0.5, 0.5,  0.5,-0.5, 0.5,  0.5, 0.5, 0.5, -0.5, 0.5, 0.5,
            // -Z
             0.5,-0.5,-0.5, -0.5,-0.5,-0.5, -0.5, 0.5,-0.5,  0.5, 0.5,-0.5,
            // -X
            -0.5,-0.5,-0.5, -0.5,-0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5,-0.5,
            // +X
             0.5,-0.5, 0.5,  0.5,-0.5,-0.5,  0.5, 0.5,-0.5,  0.5, 0.5, 0.5,
            // +Y
            -0.5, 0.5, 0.5,  0.5, 0.5, 0.5,  0.5, 0.5,-0.5, -0.5, 0.5,-0.5,
            // -Y
            -0.5,-0.5,-0.5,  0.5,-0.5,-0.5,  0.5,-0.5, 0.5, -0.5,-0.5, 0.5
        ]);
        const faceNormData = new Float32Array([
            0,0,1,  0,0,-1,  -1,0,0,  1,0,0,  0,1,0,  0,-1,0
        ]);
        const faceUVData = new Float32Array([0,0, 1,0, 1,1, 0,1]);
        const neighborOffsets = [0,0,1,  0,0,-1,  -1,0,0,  1,0,0,  0,1,0,  0,-1,0];

        function addFace(matData, x, y, z, faceIndex) {
            const baseIndex = matData.positions.length / 3;
            const vo = faceIndex * 12;
            const no = faceIndex * 3;
            const nx = faceNormData[no], ny = faceNormData[no+1], nz = faceNormData[no+2];
            const pos = matData.positions, nor = matData.normals, uvs = matData.uvs;
            for (let i = 0; i < 4; i++) {
                const vi = vo + i * 3;
                pos.push(x + faceVertData[vi], y + faceVertData[vi+1], z + faceVertData[vi+2]);
                nor.push(nx, ny, nz);
                uvs.push(faceUVData[i*2], faceUVData[i*2+1]);
            }
            const idx = matData.indices;
            idx.push(baseIndex, baseIndex+1, baseIndex+2, baseIndex, baseIndex+2, baseIndex+3);
        }

        // Original flat-world material layering, keyed purely off Y
        function blockTypeAt(y) {
            if (y > 0) return 'wood';
            if (y === 0) return 'grass';
            if (y >= -2) return 'dirt';
            if (y <= -11) return 'bedrock';
            return 'stone';
        }

        // Pre-resolved material lookup tables (avoid string compares in hot loop)
        const typeMats = {
            wood: [woodMaterial],
            grass: grassMaterials,
            dirt: dirtMaterials,
            stone: stoneMaterials,
            bedrock: bedrockMaterials
        };

        function buildWorldMesh() {
            // Dispose old geometries
            for (let i = 0; i < worldMeshes.length; i++) {
                scene.remove(worldMeshes[i]);
                worldMeshes[i].geometry.dispose();
            }
            worldMeshes.length = 0;

            const mats = {};
            function getBucket(type, vi) {
                const key = type === 'wood' ? 0 : (type.charCodeAt(0) << 4) | vi; // fast numeric key
                let b = mats[key];
                if (!b) {
                    const arr = typeMats[type];
                    b = mats[key] = {
                        positions: [], normals: [], uvs: [], indices: [],
                        material: arr[type === 'wood' ? 0 : vi]
                    };
                }
                return b;
            }

            for (const key of solidVoxels) {
                const x = unpackX(key), y = unpackY(key), z = unpackZ(key);
                const type = blockTypeAt(y);
                const vi = type === 'wood' ? 0 : variantIndex(x, y, z);
                const matData = getBucket(type, vi);

                // Face culling via packed neighbor keys
                if (!solidVoxels.has(packKey(x, y, z+1))) addFace(matData, x, y, z, 0);
                if (!solidVoxels.has(packKey(x, y, z-1))) addFace(matData, x, y, z, 1);
                if (!solidVoxels.has(packKey(x-1, y, z))) addFace(matData, x, y, z, 2);
                if (!solidVoxels.has(packKey(x+1, y, z))) addFace(matData, x, y, z, 3);
                if (!solidVoxels.has(packKey(x, y+1, z))) addFace(matData, x, y, z, 4);
                if (!solidVoxels.has(packKey(x, y-1, z))) addFace(matData, x, y, z, 5);
            }

            for (const key in mats) {
                const d = mats[key];
                const pLen = d.positions.length;
                if (pLen === 0) continue;
                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.Float32BufferAttribute(d.positions, 3));
                geom.setAttribute('normal', new THREE.Float32BufferAttribute(d.normals, 3));
                geom.setAttribute('uv', new THREE.Float32BufferAttribute(d.uvs, 2));
                geom.setIndex(d.indices);
                const mesh = new THREE.Mesh(geom, d.material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.frustumCulled = true;
                scene.add(mesh);
                worldMeshes.push(mesh);
            }
            meshDirty = false;
        }

        // ---- World generation: original flat world (32x32 grid, 12 layers deep) ----
        // The `seed` argument is kept for save-file compatibility but is unused,
        // because a flat world is identical every time.
        function generateTerrain(seed) {
            solidVoxels.clear();
            for (let x = -16; x <= 15; x++) {
                for (let z = -16; z <= 15; z++) {
                    for (let y = -11; y <= 0; y++) {
                        solidVoxels.add(packKey(x, y, z));
                    }
                }
            }
            meshDirty = true;
        }

        // ---- Serialization helpers ----
        function serializeVoxels() {
            const arr = new Int32Array(solidVoxels.size);
            let i = 0;
            for (const k of solidVoxels) arr[i++] = k;
            return int32ToBase64(arr);
        }
        function deserializeVoxels(b64) {
            solidVoxels.clear();
            const arr = base64ToInt32(b64);
            for (let i = 0; i < arr.length; i++) solidVoxels.add(arr[i]);
            meshDirty = true;
        }
        function int32ToBase64(arr) {
            const bytes = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);
            let s = '';
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(s);
        }
        function base64ToInt32(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Int32Array(bytes.buffer);
        }

        function surfaceYAt(x, z) {
            const rx = Math.round(x), rz = Math.round(z);
            for (let y = 20; y >= -12; y--) {
                if (solidVoxels.has(packKey(rx, y, rz))) return y;
            }
            return -12;
        }

        // ============================================================
        // 9. CAMERA CONTROLS (pointer lock + sprint + crouch)
        // ============================================================
        let eyeOffset = 1.6;
        let playerHeight = 1.8;
        const playerRadius = 0.3;
        const standEyeOffset = 1.6;
        const crouchEyeOffset = 1.05;
        const standPlayerHeight = 1.8;
        const crouchPlayerHeight = 1.25;
        camera.position.set(0, 2.1, 4);

        let yaw = 0, pitch = 0;

        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                const s = 0.002;
                yaw -= e.movementX * s;
                pitch -= e.movementY * s;
                const maxPitch = Math.PI / 2 - 0.01;
                pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });

        // ============================================================
        // 10. RAYCAST INTERACTION
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== renderer.domElement) return;

            raycaster.setFromCamera(centerScreen, camera);
            const hits = raycaster.intersectObjects(worldMeshes);

            if (hits.length > 0) {
                const hit = hits[0];
                const p = hit.point;
                const n = hit.face.normal;
                const bx = Math.round(p.x - n.x * 0.5);
                const by = Math.round(p.y - n.y * 0.5);
                const bz = Math.round(p.z - n.z * 0.5);

                if (e.button === 0) {
                    removeVoxel(bx, by, bz);
                } else if (e.button === 2) {
                    const tx = bx + n.x, ty = by + n.y, tz = bz + n.z;
                    const pBox = getEntityBounds(camera.position);
                    const bBox = {
                        minX: tx - 0.5, maxX: tx + 0.5,
                        minY: ty - 0.5, maxY: ty + 0.5,
                        minZ: tz - 0.5, maxZ: tz + 0.5
                    };
                    if (!evaluateBoundsOverlap(pBox, bBox)) {
                        addVoxel(tx, ty, tz);
                    }
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        // ============================================================
        // 11. PHYSICS & COLLISION
        // ============================================================
        const keyMap = {};
        window.addEventListener('keydown', (e) => { keyMap[e.code] = true; });
        window.addEventListener('keyup', (e) => { keyMap[e.code] = false; });

        let verticalVelocity = 0;
        const downwardForce = 0.0075;
        const impulseMagnitude = 0.16;
        let isOnGround = false;

        function getEntityBounds(pos) {
            return {
                minX: pos.x - playerRadius, maxX: pos.x + playerRadius,
                minY: pos.y - eyeOffset,    maxY: pos.y - eyeOffset + playerHeight,
                minZ: pos.z - playerRadius, maxZ: pos.z + playerRadius
            };
        }

        function evaluateBoundsOverlap(a, b) {
            const eps = 0.001;
            return (a.minX < b.maxX - eps && a.maxX > b.minX + eps) &&
                   (a.minY < b.maxY - eps && a.maxY > b.minY + eps) &&
                   (a.minZ < b.maxZ - eps && a.maxZ > b.minZ + eps);
        }

        function checkVoxelCollisions(aabb) {
            const minX = Math.floor(aabb.minX + 0.5);
            const maxX = Math.floor(aabb.maxX + 0.5);
            const minY = Math.floor(aabb.minY + 0.5);
            const maxY = Math.floor(aabb.maxY + 0.5);
            const minZ = Math.floor(aabb.minZ + 0.5);
            const maxZ = Math.floor(aabb.maxZ + 0.5);
            const out = [];
            for (let x = minX; x <= maxX; x++)
                for (let y = minY; y <= maxY; y++)
                    for (let z = minZ; z <= maxZ; z++)
                        if (solidVoxels.has(packKey(x, y, z)))
                            out.push({
                                minX: x-0.5, maxX: x+0.5,
                                minY: y-0.5, maxY: y+0.5,
                                minZ: z-0.5, maxZ: z+0.5
                            });
            return out;
        }

        function computeKinematics() {
            const crouching = keyMap['KeyC'] || keyMap['ControlLeft'];
            const sprinting = !crouching && (keyMap['ShiftLeft'] || keyMap['ShiftRight']);

            // Update height for crouch (smooth enough by direct assign)
            eyeOffset = crouching ? crouchEyeOffset : standEyeOffset;
            playerHeight = crouching ? crouchPlayerHeight : standPlayerHeight;

            const moveSpeed = 0.07 * (crouching ? 0.45 : (sprinting ? 1.85 : 1.0));

            const forwardX = -Math.sin(yaw);
            const forwardZ = -Math.cos(yaw);
            const rightX = Math.cos(yaw);
            const rightZ = -Math.sin(yaw);

            let dx = 0, dz = 0;
            if (keyMap['KeyW'] || keyMap['ArrowUp'])    { dx += forwardX * moveSpeed; dz += forwardZ * moveSpeed; }
            if (keyMap['KeyS'] || keyMap['ArrowDown'])  { dx -= forwardX * moveSpeed; dz -= forwardZ * moveSpeed; }
            if (keyMap['KeyA'] || keyMap['ArrowLeft'])  { dx -= rightX * moveSpeed;   dz -= rightZ * moveSpeed; }
            if (keyMap['KeyD'] || keyMap['ArrowRight']) { dx += rightX * moveSpeed;   dz += rightZ * moveSpeed; }

            if (keyMap['Space'] && isOnGround && !crouching) {
                verticalVelocity = impulseMagnitude;
                isOnGround = false;
            }

            // Vertical
            verticalVelocity -= downwardForce;
            camera.position.y += verticalVelocity;
            let pBox = getEntityBounds(camera.position);
            let nodes = checkVoxelCollisions(pBox);
            isOnGround = false;
            for (const b of nodes) {
                if (evaluateBoundsOverlap(pBox, b)) {
                    if (verticalVelocity < 0) {
                        camera.position.y = b.maxY + eyeOffset;
                        verticalVelocity = 0;
                        isOnGround = true;
                    } else if (verticalVelocity > 0) {
                        camera.position.y = b.minY + eyeOffset - playerHeight;
                        verticalVelocity = 0;
                    }
                    pBox = getEntityBounds(camera.position);
                }
            }

            // X
            camera.position.x += dx;
            pBox = getEntityBounds(camera.position);
            nodes = checkVoxelCollisions(pBox);
            for (const b of nodes) {
                if (evaluateBoundsOverlap(pBox, b)) {
                    if (dx > 0) camera.position.x = b.minX - playerRadius;
                    else if (dx < 0) camera.position.x = b.maxX + playerRadius;
                    pBox = getEntityBounds(camera.position);
                }
            }

            // Z
            camera.position.z += dz;
            pBox = getEntityBounds(camera.position);
            nodes = checkVoxelCollisions(pBox);
            for (const b of nodes) {
                if (evaluateBoundsOverlap(pBox, b)) {
                    if (dz > 0) camera.position.z = b.minZ - playerRadius;
                    else if (dz < 0) camera.position.z = b.maxZ + playerRadius;
                    pBox = getEntityBounds(camera.position);
                }
            }

            if (camera.position.y < -35) {
                camera.position.set(0, 2.1, 0);
                verticalVelocity = 0;
            }
        }

        // ============================================================
        // 12. DAY / NIGHT + ATMOSPHERE UPDATE
        // ============================================================
        const skyTopDayColor   = new THREE.Color(0x2a6fd0);
        const skyTopDuskColor  = new THREE.Color(0x1b2a5c);
        const skyTopNightColor = new THREE.Color(0x01030a);

        const camToSun = new THREE.Vector3();
        const camForward = new THREE.Vector3();
        const sunProjNDC = new THREE.Vector3();

        function blendSky(out, night, dusk, day, h) {
            if (h >= 0.16) { out.copy(day); }
            else if (h > -0.16) {
                const t = (h + 0.16) / 0.32;
                if (t < 0.5) out.copy(night).lerp(dusk, t * 2);
                else         out.copy(dusk).lerp(day, (t - 0.5) * 2);
            } else { out.copy(night); }
        }

        function updateDayNightCycle(delta) {
            timeOfDay = (timeOfDay + delta / dayCycleDuration) % 1;
            elapsedTime += delta;

            const angle = timeOfDay * Math.PI * 2;
            sunDir.set(
                Math.cos(angle),
                Math.sin(angle) * Math.cos(sunOrbitTilt),
                Math.sin(angle) * Math.sin(sunOrbitTilt)
            ).normalize();
            moonDir.copy(sunDir).negate();

            const h = sunDir.y;
            const daylight = THREE.MathUtils.smoothstep(h, -0.12, 0.28);

            if (h >= 0.16) skyColor.copy(skyDayColor);
            else if (h > -0.16) {
                const t = (h + 0.16) / 0.32;
                if (t < 0.5) skyColor.copy(skyNightColor).lerp(skyDuskColor, t * 2);
                else         skyColor.copy(skyDuskColor).lerp(skyDayColor, (t - 0.5) * 2);
            } else skyColor.copy(skyNightColor);

            scene.background.copy(skyColor);
            scene.fog.color.copy(skyColor);

            sunLight.intensity = 1.65 * daylight;
            sunLight.color.copy(sunDuskColor).lerp(sunDayColor, THREE.MathUtils.clamp((h - 0.05) / 0.30, 0, 1));
            moonLight.intensity = 0.42 * (1 - daylight);
            moonLight.color.copy(moonColor);

            // Stronger fill so pixel textures stay readable in shade / night
            ambientLight.intensity = 0.28 + 0.28 * daylight;
            hemiLight.intensity    = 0.20 + 0.28 * daylight;

            const lightDistance = 60;
            sunLight.position.copy(camera.position).addScaledVector(sunDir, lightDistance);
            sunLight.target.position.copy(camera.position);
            sunLight.target.updateMatrixWorld();

            moonLight.position.copy(camera.position).addScaledVector(moonDir, lightDistance);
            moonLight.target.position.copy(camera.position);
            moonLight.target.updateMatrixWorld();

            // Sky uniforms
            tmpColor.copy(sunDuskColor).lerp(sunDayColor, THREE.MathUtils.clamp((h - 0.05) / 0.30, 0, 1));
            blendSky(skyUniforms.topColor.value, skyTopNightColor, skyTopDuskColor, skyTopDayColor, h);
            skyUniforms.bottomColor.value.copy(skyColor);
            skyUniforms.sunDir.value.copy(sunDir);
            skyUniforms.sunColor.value.copy(tmpColor);
            skyUniforms.sunGlow.value = Math.pow(daylight, 0.8) * 0.55;
            skyDome.position.copy(camera.position);

            // Sun / moon sprites
            const skyDistance = 300;
            sunBody.position.copy(camera.position).addScaledVector(sunDir, skyDistance);
            moonBody.position.copy(camera.position).addScaledVector(moonDir, skyDistance);

            const sunBrightness = 0.55 + 0.55 * daylight;
            sunSpriteMat.color.setRGB(1.0, 0.9, 0.72).multiplyScalar(sunBrightness);
            sunSpriteMat.opacity = THREE.MathUtils.clamp((h + 0.08) / 0.25, 0, 1) * 0.85;
            sunBody.visible = sunSpriteMat.opacity > 0.01;

            moonSpriteMat.opacity = THREE.MathUtils.clamp((-h + 0.08) / 0.25, 0, 1) * 0.85;
            moonBody.visible = moonSpriteMat.opacity > 0.01;

            // Stars
            starGroup.position.copy(camera.position);
            starGroup.quaternion.setFromAxisAngle(celestialAxis, angle);
            starMat.opacity = Math.pow(1 - daylight, 1.6) * 0.95;
            starGroup.visible = starMat.opacity > 0.02;

            // Cloud tint — stays neutral white at noon, softly warm at dusk, cool at night
            if (h >= 0.20) {
                cloudTint.copy(cloudDayTint);
            } else if (h > -0.10) {
                const t = (h + 0.10) / 0.30;
                if (t < 0.5) cloudTint.copy(cloudNightTint).lerp(cloudDuskTint, t * 2);
                else         cloudTint.copy(cloudDuskTint).lerp(cloudDayTint, (t - 0.5) * 2);
            } else {
                cloudTint.copy(cloudNightTint);
            }

            // Update each cloud layer
            cloudGroup.position.set(camera.position.x, 0, camera.position.z);
            for (const layer of cloudLayers) {
                layer.mat.color.copy(cloudTint);
                layer.tex.offset.x += delta * layer.cfg.windX;
                layer.tex.offset.y += delta * layer.cfg.windY;
                // Clouds slightly more visible at noon
                layer.mat.opacity = layer.cfg.opacity * (0.55 + 0.45 * daylight);
            }

            // Post-processing strengths
            bloomPass.strength = 0.16 + 0.22 * daylight;
            halationUniforms.strength.value = 0.6 * daylight;
            godRaysUniforms.rayTint.value.copy(sunDuskColor).lerp(sunDayColor, THREE.MathUtils.clamp((h - 0.05) / 0.30, 0, 1));

            godRayDaylight = daylight;
            godRayHorizonH = h;
        }

        function updateGodRayUniforms() {
            camera.updateMatrixWorld();
            camera.getWorldDirection(camForward);
            camToSun.copy(sunBody.position).sub(camera.position).normalize();

            if (camForward.dot(camToSun) <= 0 || godRayDaylight < 0.01) {
                godRaysUniforms.visibility.value = 0;
                return;
            }

            sunProjNDC.copy(sunBody.position).project(camera);
            godRaysUniforms.sunPosition.value.set(
                (sunProjNDC.x + 1) * 0.5,
                (sunProjNDC.y + 1) * 0.5
            );

            const edgeX = 1.0 - Math.min(Math.abs(sunProjNDC.x), 1.0);
            const edgeY = 1.0 - Math.min(Math.abs(sunProjNDC.y), 1.0);
            const edgeFade = THREE.MathUtils.smoothstep(Math.min(edgeX, edgeY), 0.0, 0.35);
            const horizonBoost = 0.55 + 0.45 * (1.0 - Math.min(Math.abs(godRayHorizonH) * 3.0, 1.0));

            godRaysUniforms.visibility.value = edgeFade * godRayDaylight * horizonBoost;
        }

        // ============================================================
        // 13. RESIZE + MAIN LOOP
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bloomPass.setSize(window.innerWidth, window.innerHeight);
            halationUniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });

        const fpsElement = document.getElementById('fps-counter');
        let frameCount = 0;
        let lastTime = performance.now();
        let lastFrameTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            frameCount++;
            if (now - lastTime >= 250) {
                fpsElement.textContent = `${Math.round((frameCount * 1000) / (now - lastTime))} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            updateDayNightCycle(delta);

            if (appState === 'menu') {
                updateMenuCamera(delta);
            } else {
                computeKinematics();
            }

            if (meshDirty) buildWorldMesh();
            updateGodRayUniforms();

            if (usePostProcessing) composer.render();
            else renderer.render(scene, camera);
        }

        // ============================================================
        // 14. SAVE SYSTEM + WORLD MANAGEMENT
        // ============================================================
        const STORAGE_KEY  = 'voxelworld.saves.v1';
        const SETTINGS_KEY = 'voxelworld.settings.v1';

        let appState = 'menu';          // 'menu' | 'playing'
        let worlds = [];                // saved world records
        let selectedWorldId = null;
        let previewWorld = null;        // world currently loaded into the scene
        let currentWorld = null;        // world currently being played
        let menuOrbitAngle = Math.PI * 0.25;
        let usePostProcessing = true;

        const menuEl = document.getElementById('menu');

        const PLACEHOLDER_THUMB = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="176" height="110">' +
            '<rect width="176" height="110" fill="#151d28"/>' +
            '<text x="88" y="59" fill="#465a72" font-family="monospace" font-size="12" text-anchor="middle">NO IMAGE</text>' +
            '</svg>');

        function saveWorlds() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(worlds)); }
            catch (e) { console.warn('Could not save worlds:', e); }
        }
        function loadWorlds() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                worlds = Array.isArray(parsed) ? parsed : [];
            } catch (e) { worlds = []; }
        }

        function createWorldRecord(name, seed, voxels, id) {
            const now = Date.now();
            return {
                id: id || ('w' + now.toString(36) + Math.random().toString(36).slice(2, 7)),
                name: name || 'World',
                seed: (seed === undefined || seed === null) ? ((Math.random() * 0x7fffffff) | 0) : (seed | 0),
                voxels: voxels || null,
                thumb: null,
                created: now,
                updated: now
            };
        }

        // ---- Load a world record into the live scene ----
        function setPreviewWorld(world) {
            previewWorld = world;
            if (world.voxels) {
                deserializeVoxels(world.voxels);
            } else {
                generateTerrain(world.seed);
            }
            buildWorldMesh();
        }

        // ---- Screenshot the scene for the world thumbnail ----
        function captureThumbnail(w, h) {
            w = w || 176; h = h || 110;
            const prevRatio = renderer.getPixelRatio();

            const cam = new THREE.PerspectiveCamera(58, w / h, 0.1, 1000);
            cam.position.set(23, 15, 23);
            cam.lookAt(0, -1, 0);

            renderer.setRenderTarget(null);
            renderer.setPixelRatio(1);
            renderer.setSize(w, h, false);
            renderer.render(scene, cam);

            let data = '';
            try { data = renderer.domElement.toDataURL('image/jpeg', 0.6); }
            catch (e) { data = ''; }

            renderer.setPixelRatio(prevRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bloomPass.setSize(window.innerWidth, window.innerHeight);

            return data;
        }

        // ---- Export / import .vwf ----
        function exportWorld(world) {
            const payload = {
                format: 'vwf',
                version: 1,
                name: world.name,
                seed: world.seed,
                created: world.created,
                voxels: world.voxels || ''
            };
            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (world.name || 'world').replace(/[^\w\-]+/g, '_') + '.vwf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function onImportFile(e) {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(String(reader.result));
                    if (!data || data.format !== 'vwf' || typeof data.voxels !== 'string') {
                        throw new Error('invalid');
                    }
                    const world = createWorldRecord(
                        data.name || file.name.replace(/\.vwf$/i, ''),
                        data.seed,
                        data.voxels,
                        null
                    );
                    world.created = data.created || Date.now();
                    world.updated = Date.now();

                    setPreviewWorld(world);
                    world.thumb = captureThumbnail();

                    worlds.unshift(world);
                    selectedWorldId = world.id;
                    saveWorlds();
                    renderWorldList();

                    startGame(world);
                } catch (err) {
                    alert('Could not import: this is not a valid .vwf file.');
                }
            };
            reader.readAsText(file);
        }

        // ============================================================
        // 15. MENU UI
        // ============================================================
        function showPanel(name) {
            document.getElementById('menu-main').classList.toggle('hidden', name !== 'main');
            document.getElementById('panel-new').classList.toggle('hidden', name !== 'new');
            document.getElementById('panel-play').classList.toggle('hidden', name !== 'play');
            document.getElementById('panel-settings').classList.toggle('hidden', name !== 'settings');

            if (name === 'play') renderWorldList();
            if (name === 'settings') {
                document.getElementById('quality').value = settings.quality;
                updateQualityHint();
            }
        }

        function updatePlayButtons() {
            const has = !!selectedWorldId && worlds.some(w => w.id === selectedWorldId);
            document.getElementById('btn-play-selected').disabled = !has;
            document.getElementById('btn-export').disabled = !has;
        }

        function renderWorldList() {
            const list = document.getElementById('world-list');
            list.innerHTML = '';

            if (!worlds.length) {
                const p = document.createElement('p');
                p.className = 'empty';
                p.textContent = 'No worlds yet — create one!';
                list.appendChild(p);
                updatePlayButtons();
                return;
            }

            for (const w of worlds) {
                const card = document.createElement('div');
                card.className = 'world-card' + (w.id === selectedWorldId ? ' selected' : '');
                card.dataset.id = w.id;

                const img = document.createElement('img');
                img.src = w.thumb || PLACEHOLDER_THUMB;
                img.alt = '';
                img.draggable = false;
                card.appendChild(img);

                const info = document.createElement('div');
                info.className = 'world-info';
                const nm = document.createElement('div');
                nm.className = 'world-name';
                nm.textContent = w.name;
                const dt = document.createElement('div');
                dt.className = 'world-date';
                dt.textContent = new Date(w.updated || w.created).toLocaleString();
                info.appendChild(nm);
                info.appendChild(dt);
                card.appendChild(info);

                const actions = document.createElement('div');
                actions.className = 'world-actions';
                const ex = document.createElement('button');
                ex.className = 'mini';
                ex.textContent = 'EXPORT';
                ex.dataset.act = 'export';
                const del = document.createElement('button');
                del.className = 'mini danger';
                del.textContent = 'DEL';
                del.dataset.act = 'delete';
                actions.appendChild(ex);
                actions.appendChild(del);
                card.appendChild(actions);

                card.addEventListener('click', (ev) => {
                    const act = ev.target && ev.target.dataset ? ev.target.dataset.act : null;
                    if (act === 'export') { ev.stopPropagation(); exportWorld(w); return; }
                    if (act === 'delete') { ev.stopPropagation(); deleteWorld(w); return; }
                    selectWorld(w);
                });
                card.addEventListener('dblclick', () => startGame(w));

                list.appendChild(card);
            }

            updatePlayButtons();
        }

        function selectWorld(w) {
            selectedWorldId = w.id;
            setPreviewWorld(w);
            renderWorldList();
        }

        function deleteWorld(w) {
            if (!confirm('Delete world "' + w.name + '"?')) return;
            worlds = worlds.filter(x => x.id !== w.id);
            if (selectedWorldId === w.id) selectedWorldId = null;
            saveWorlds();
            renderWorldList();
        }

        // ---- New world ----
        function onCreateWorld() {
            const input = document.getElementById('world-name');
            const name = (input.value || '').trim() || 'New World';

            const world = createWorldRecord(name, null, null, null);
            setPreviewWorld(world);                 // generate fresh flat world
            world.voxels = serializeVoxels();       // bake it so it is reproducible
            world.thumb = captureThumbnail();

            worlds.unshift(world);
            selectedWorldId = world.id;
            saveWorlds();
            renderWorldList();
            input.value = '';

            startGame(world);
        }

        // ============================================================
        // 16. GAME ENTRY / EXIT
        // ============================================================
        function startGame(world) {
            if (!world) return;
            currentWorld = world;

            if (previewWorld !== world) setPreviewWorld(world);

            // Spawn safely on top of the terrain near the middle
            const sx = 0.5, sz = 4.5;
            const top = surfaceYAt(sx, sz);
            camera.position.set(sx, top + 2.1, sz);
            verticalVelocity = 0;
            isOnGround = false;
            yaw = 0;
            pitch = 0;
            eyeOffset = standEyeOffset;
            playerHeight = standPlayerHeight;
            camera.rotation.set(pitch, yaw, 0, 'YXZ');

            appState = 'playing';
            menuEl.classList.add('hidden');
            document.body.classList.add('playing');

            renderer.domElement.requestPointerLock();
        }

        function exitToMenu() {
            if (appState !== 'playing') return;
            appState = 'menu';

            if (currentWorld) {
                currentWorld.voxels = serializeVoxels();
                currentWorld.updated = Date.now();
                currentWorld.thumb = captureThumbnail();
                saveWorlds();
                previewWorld = currentWorld;
            }
            currentWorld = null;

            document.body.classList.remove('playing');
            menuEl.classList.remove('hidden');
            renderWorldList();
            showPanel('main');

            if (document.pointerLockElement) document.exitPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            if (appState === 'playing' && document.pointerLockElement !== renderer.domElement) {
                exitToMenu();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && appState === 'playing') exitToMenu();
        });

        // ============================================================
        // 17. SETTINGS / QUALITY
        // ============================================================
        const QUALITY_PRESETS = {
            min:    { pixelRatio: 0.55, shadows: false, shadowSize: 512,  bloom: false, godRays: false, halation: false, post: false },
            low:    { pixelRatio: 0.75, shadows: true,  shadowSize: 1024, bloom: true,  godRays: false, halation: false, post: true  },
            medium: { pixelRatio: 1.00, shadows: true,  shadowSize: 1024, bloom: true,  godRays: true,  halation: false, post: true  },
            high:   { pixelRatio: 1.50, shadows: true,  shadowSize: 2048, bloom: true,  godRays: true,  halation: true,  post: true  },
            max:    { pixelRatio: 2.00, shadows: true,  shadowSize: 4096, bloom: true,  godRays: true,  halation: true,  post: true  }
        };

        const QUALITY_HINTS = {
            min:    'Fastest. No shadows, no post-processing, reduced resolution.',
            low:    'Light shadows and bloom only. Good for weak GPUs.',
            medium: 'Adds volumetric god rays. Balanced performance.',
            high:   'Full post-processing stack with soft shadows. Recommended.',
            max:    'Maximum shadow resolution and full effects. Heavy.'
        };

        let settings = { quality: 'high' };

        function refreshMaterialShadows() {
            scene.traverse((o) => {
                if (!o.material) return;
                const m = o.material;
                if (Array.isArray(m)) m.forEach(mm => { mm.needsUpdate = true; });
                else m.needsUpdate = true;
            });
        }

        function applyQuality(name) {
            const key = QUALITY_PRESETS[name] ? name : 'high';
            const q = QUALITY_PRESETS[key];
            settings.quality = key;

            const pr = Math.min(window.devicePixelRatio, q.pixelRatio);
            renderer.setPixelRatio(pr);
            composer.setPixelRatio(pr);

            renderer.shadowMap.enabled = q.shadows;
            sunLight.castShadow = q.shadows;
            if (sunLight.shadow.map) {
                sunLight.shadow.map.dispose();
                sunLight.shadow.map = null;
            }
            sunLight.shadow.mapSize.width = q.shadowSize;
            sunLight.shadow.mapSize.height = q.shadowSize;

            bloomPass.enabled = q.bloom;
            godRaysPass.enabled = q.godRays;
            halationPass.enabled = q.halation;
            usePostProcessing = q.post;

            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bloomPass.setSize(window.innerWidth, window.innerHeight);
            halationUniforms.resolution.value.set(window.innerWidth, window.innerHeight);

            refreshMaterialShadows();
            saveSettings();
        }

        function updateQualityHint() {
            document.getElementById('quality-hint').textContent =
                QUALITY_HINTS[settings.quality] || '';
        }

        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
        }
        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (raw) {
                    const s = JSON.parse(raw);
                    if (s && QUALITY_PRESETS[s.quality]) settings.quality = s.quality;
                }
            } catch (e) {}
        }

        // ============================================================
        // 18. MENU EVENT WIRING
        // ============================================================
        function wireMenuEvents() {
            document.getElementById('btn-new').addEventListener('click', () => {
                showPanel('new');
                const i = document.getElementById('world-name');
                i.focus();
            });
            document.getElementById('btn-play').addEventListener('click', () => showPanel('play'));
            document.getElementById('btn-settings').addEventListener('click', () => showPanel('settings'));

            document.querySelectorAll('[data-back]').forEach(btn => {
                btn.addEventListener('click', () => showPanel('main'));
            });

            document.getElementById('btn-create').addEventListener('click', onCreateWorld);
            document.getElementById('world-name').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') onCreateWorld();
            });

            document.getElementById('btn-import').addEventListener('click', () => {
                document.getElementById('file-import').click();
            });
            document.getElementById('file-import').addEventListener('change', onImportFile);

            document.getElementById('btn-play-selected').addEventListener('click', () => {
                const w = worlds.find(x => x.id === selectedWorldId);
                if (w) startGame(w);
            });
            document.getElementById('btn-export').addEventListener('click', () => {
                const w = worlds.find(x => x.id === selectedWorldId);
                if (w) exportWorld(w);
            });

            document.getElementById('quality').addEventListener('change', (e) => {
                applyQuality(e.target.value);
                updateQualityHint();
            });
        }

        // ============================================================
        // 19. MENU BACKGROUND CAMERA (slow orbit around world center)
        // ============================================================
        function updateMenuCamera(delta) {
            menuOrbitAngle += delta * 0.10;
            const radius = 24;
            const height = 12.5;
            camera.position.set(
                Math.sin(menuOrbitAngle) * radius,
                height,
                Math.cos(menuOrbitAngle) * radius
            );
            camera.lookAt(0, -1, 0);
        }

        // ============================================================
        // 20. INIT
        // ============================================================
        loadSettings();
        applyQuality(settings.quality);
        updateQualityHint();

        loadWorlds();

        if (worlds.length > 0) {
            selectedWorldId = worlds[0].id;
            setPreviewWorld(worlds[0]);
        } else {
            // Fresh install: show the flat world in the background
            const w = createWorldRecord('Preview', null, null, 'preview');
            setPreviewWorld(w);
        }

        wireMenuEvents();
        renderWorldList();
        showPanel('main');

        animate();
    </script>
</body>
</html>
